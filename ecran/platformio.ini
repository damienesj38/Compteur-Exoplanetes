; Compteur d'exoplanètes - Elecrow CrowPanel Advance 7.0" (DIS02170A, ESP32-S3-WROOM-1-N16R8)
;   pio run -e v13   -> cartes V1.3, V1.4, V1.5 (stock actuel)
;   pio run -e v12   -> cartes V1.2

[platformio]
default_envs = v13

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.embed_files = certs/x509_crt_bundle.bin
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
build_unflags = -std=gnu++11
lib_deps =
    https://github.com/lovyan03/LovyanGFX.git#1.2.36
    https://github.com/bblanchon/ArduinoJson.git#v7.4.2
    https://github.com/tzapu/WiFiManager.git#v2.0.17
; Réglages internes de la puce repris des exemples ESP-IDF d'Elecrow (lecture de la
; PSRAM par blocs de 64 octets, programme exécuté depuis la PSRAM) : sans eux, le bas
; de l'image décroche dès que la carte travaille. Les composants retirés ne servent
; pas ici et ne sont pas téléchargeables partout.
custom_sdkconfig =
    CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y
    CONFIG_SPIRAM_XIP_FROM_PSRAM=y
    CONFIG_LCD_RGB_ISR_IRAM_SAFE=y
custom_component_remove =
    chmorgan/esp-libhelix-mp3
    espressif/cbor
    espressif/cjson
    espressif/dm9051
    espressif/esp-dsp
    espressif/esp-modbus
    espressif/esp-sr
    espressif/esp-zboss-lib
    espressif/esp-zigbee-lib
    espressif/esp_diag_data_store
    espressif/esp_diagnostics
    espressif/esp_hosted
    espressif/esp_insights
    espressif/esp_modem
    espressif/esp_rainmaker
    espressif/esp_wifi_remote
    espressif/ksz8851snl
    espressif/lan867x
    espressif/libsodium
    espressif/mdns
    espressif/network_provisioning
    espressif/qrcode
    espressif/rmaker_common
    espressif/w5500
    joltwallet/littlefs
upload_speed = 921600
monitor_speed = 115200

[env:v13]
build_flags = ${env.build_flags} -DCROWPANEL_ADVANCE_REV=130

[env:v12]
build_flags = ${env.build_flags} -DCROWPANEL_ADVANCE_REV=120
